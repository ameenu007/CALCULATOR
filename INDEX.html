<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0f172a;
    }

    .calculator {
      width: 320px;
      background-color: #1e293b;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .display {
      width: 100%;
      height: 90px;
      background-color: #0f172a;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 20px;
      word-break: break-all;
    }

    .history {
      font-size: 0.9rem;
      color: #64748b;
      min-height: 1.2em;
    }

    .current {
      font-size: 2rem;
      font-weight: 600;
      color: #f8fafc;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 56px;
      border: none;
      border-radius: 12px;
      font-size: 1.25rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      background-color: #334155;
      color: #f8fafc;
    }

    button:hover {
      filter: brightness(1.2);
    }

    button:active {
      transform: scale(0.95);
    }

    button.operator {
      background-color: #3b82f6;
      color: #ffffff;
    }

    button.action {
      background-color: #475569;
      color: #cbd5e1;
    }

    button.equals {
      background-color: #22c55e;
      color: #ffffff;
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="display">
      <div class="history" id="history"></div>
      <div class="current" id="current">0</div>
    </div>
    <div class="buttons">
      <button class="action" onclick="clearAll()">AC</button>
      <button class="action" onclick="deleteLast()">⌫</button>
      <button class="action" onclick="appendOperator('%')">%</button>
      <button class="operator" onclick="appendOperator('/')">÷</button>

      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="appendOperator('*')">×</button>

      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="appendOperator('-')">−</button>

      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="operator" onclick="appendOperator('+')">+</button>

      <button onclick="appendNumber('0')">0</button>
      <button onclick="appendDecimal('.')">.</button>
      <button class="equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let currentInput = '0';
    let previousInput = '';
    let operation = null;
    let resetScreen = false;

    const currentDisplay = document.getElementById('current');
    const historyDisplay = document.getElementById('history');

    function updateDisplay() {
      currentDisplay.textContent = currentInput;
      if (operation !== null) {
        historyDisplay.textContent = `${previousInput} ${operation}`;
      } else {
        historyDisplay.textContent = '';
      }
    }

    function appendNumber(number) {
      if (currentInput === '0' || resetScreen) {
        currentInput = number;
        resetScreen = false;
      } else {
        currentInput += number;
      }
      updateDisplay();
    }

    function appendDecimal() {
      if (resetScreen) {
        currentInput = '0.';
        resetScreen = false;
      } else if (!currentInput.includes('.')) {
        currentInput += '.';
      }
      updateDisplay();
    }

    function appendOperator(op) {
      if (operation !== null) calculate();
      previousInput = currentInput;
      operation = op;
      resetScreen = true;
      updateDisplay();
    }

    function calculate() {
      if (operation === null || resetScreen) return;
      let prev = parseFloat(previousInput);
      let curr = parseFloat(currentInput);
      let result = 0;

      switch (operation) {
        case '+': result = prev + curr; break;
        case '-': result = prev - curr; break;
        case '*': result = prev * curr; break;
        case '/':
          result = curr === 0 ? 'Error' : prev / curr;
          break;
        case '%': result = prev % curr; break;
      }

      historyDisplay.textContent = `${previousInput} ${operation} ${currentInput} =`;
      currentInput = result.toString();
      operation = null;
      resetScreen = true;
      updateDisplay();
    }

    function clearAll() {
      currentInput = '0';
      previousInput = '';
      operation = null;
      resetScreen = false;
      updateDisplay();
    }

    function deleteLast() {
      if (resetScreen) return;
      currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : '0';
      updateDisplay();
    }

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
      if (e.key === '.') appendDecimal();
      if (['+', '-', '*', '/'].includes(e.key)) appendOperator(e.key);
      if (e.key === 'Enter' || e.key === '=') calculate();
      if (e.key === 'Backspace') deleteLast();
      if (e.key === 'Escape') clearAll();
    });
  </script>
</body>
</html>
